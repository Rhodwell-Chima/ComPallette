version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: compallette_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compallette_db}
      POSTGRES_USER: ${POSTGRES_USER:-compallette_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compallette_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compallette_user} -d ${POSTGRES_DB:-compallette_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Default: Python / Django REST Framework Ingestion Service
  backend:
    build:
      context: ./backend/django
      dockerfile: Dockerfile
    container_name: compallette_backend_django
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend/django:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-compallette-insecure-dev-key-change-in-production}
      - DB_NAME=${POSTGRES_DB:-compallette_db}
      - DB_USER=${POSTGRES_USER:-compallette_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-compallette_secure_pass_2026}
      - DB_HOST=db
      - DB_PORT=5432
      - COMPALLETTE_API_KEY=${COMPALLETTE_API_KEY:-compallette-mining-secret-key-v1}
      - CORS_ALLOW_ALL=True
    depends_on:
      db:
        condition: service_healthy

  # Optional: Rust Rocket Backend Service (High-throughput comparison target)
  # Run via: docker compose --profile rocket up
  backend-rocket:
    build:
      context: ./backend/rocket
      dockerfile: Dockerfile
    container_name: compallette_backend_rocket
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - ROCKET_PORT=8000
      - ROCKET_ADDRESS=0.0.0.0
      - DATABASE_URL=postgres://${POSTGRES_USER:-compallette_user}:${POSTGRES_PASSWORD:-compallette_secure_pass_2026}@db:5432/${POSTGRES_DB:-compallette_db}
      - COMPALLETTE_API_KEY=${COMPALLETTE_API_KEY:-compallette-mining-secret-key-v1}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - rocket

  # React 18 + TypeScript Industrial Cockpit Dashboard
  frontend:
    build:
      context: ./frontend/react
      dockerfile: Dockerfile
    container_name: compallette_frontend_react
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
