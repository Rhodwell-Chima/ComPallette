version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: compallette_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compallette_db}
      POSTGRES_USER: ${POSTGRES_USER:-compallette_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compallette_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compallette_user} -d ${POSTGRES_DB:-compallette_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compallette_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-compallette-insecure-dev-key-change-in-production}
      - DB_NAME=${POSTGRES_DB:-compallette_db}
      - DB_USER=${POSTGRES_USER:-compallette_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-compallette_secure_pass_2026}
      - DB_HOST=db
      - DB_PORT=5432
      - COMPALLETTE_API_KEY=${COMPALLETTE_API_KEY:-compallette-mining-secret-key-v1}
      - CORS_ALLOW_ALL=True
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compallette_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
