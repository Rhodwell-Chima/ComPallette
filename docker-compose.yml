services:
  db:
    image: postgres:16-alpine
    container_name: compallette_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Default: Python / Django REST Framework Ingestion Service
  backend:
    build:
      context: ./backend/django
      dockerfile: Dockerfile
      args:
        COMPALLETTE_BUILD_REVISION: ${COMPALLETTE_BUILD_REVISION:-development}
    container_name: compallette_backend_django
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             gunicorn compallette.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 30"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      # Reserve 192.168.1.176 for innovation-hub03.local; the ESP32 resolves .local to this IP.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,innovation-hub03.local,192.168.1.176}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - COMPALLETTE_INSTALLATION_ID=${COMPALLETTE_INSTALLATION_ID:?Set a unique installation UUID}
      - COMPALLETTE_DEVICE_KEY_DIR=/run/device-keys
      - COMPALLETTE_BUILD_REVISION=${COMPALLETTE_BUILD_REVISION:-development}
      - CORS_ALLOW_ALL=0
    volumes:
      - ${COMPALLETTE_DEVICE_KEY_DIR:?Set protected device key directory}:/run/device-keys:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # React 18 + TypeScript Industrial Cockpit Dashboard
  frontend:
    build:
      context: ./frontend/react
      dockerfile: Dockerfile
      args:
        VITE_COMPALLETTE_BUILD_REVISION: ${COMPALLETTE_BUILD_REVISION:-development}
    container_name: compallette_frontend_react
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  watchdog:
    build:
      context: ./backend/django
      dockerfile: Dockerfile
      args:
        COMPALLETTE_BUILD_REVISION: ${COMPALLETTE_BUILD_REVISION:-development}
    restart: unless-stopped
    command: ["python", "manage.py", "run_watchdog"]
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DEBUG=${DEBUG:-0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,innovation-hub03.local,192.168.1.176}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - COMPALLETTE_INSTALLATION_ID=${COMPALLETTE_INSTALLATION_ID:?Set a unique installation UUID}
      - COMPALLETTE_DEVICE_KEY_DIR=/run/device-keys
      - COMPALLETTE_BUILD_REVISION=${COMPALLETTE_BUILD_REVISION:-development}
      - COMPALLETTE_WATCHDOG_INTERVAL=5
    volumes:
      - ${COMPALLETTE_DEVICE_KEY_DIR:?Set protected device key directory}:/run/device-keys:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
